name: Render README cards

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli pillow
      - name: Fetch contribution data
        run: python scripts/fetch_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README cards (hero, graph, activity, tiles, toolbox, repos)
        run: python scripts/render_readme_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || (git commit -m "chore: refresh README cards" && git push)
